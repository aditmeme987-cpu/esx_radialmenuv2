<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ESX Radial Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="backdrop"></div>

        <div class="radial">
            <div class="header">
                <div id="title">GANTARA</div>
                <div id="subtitle">RADIAL MENU</div>
            </div>

            <div id="items"></div>

            <button id="center" type="button">
                <div class="center-icon">✕</div>
                <div class="center-text">CLOSE</div>
            </button>
        </div>

        <div class="help"><b>F1</b> / <b>ESC</b> untuk tutup</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
